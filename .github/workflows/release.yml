name: Release

# Push a tag like v0.5.0 (after bumping version in pyproject.toml and src/rs7/__init__.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=${GITHUB_REF_NAME#v}
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/rs7/__init__.py)
          if [ "$version" != "$py" ] || [ "$version" != "$init" ]; then
            echo "::error::tag $version, pyproject.toml $py, __init__.py $init must all match"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  python-dist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build
      - run: uv run --group build pyinstaller --noconfirm --log-level WARN packaging/rs7.spec
      - name: Smoke test
        run: .\dist\rs7\rs7.exe version
      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.verify.outputs.version }}" packaging\windows\rs7.iss
      - name: Portable zip
        run: Compress-Archive -Path dist\rs7 -DestinationPath "dist\gammascientific-rs7-${{ needs.verify.outputs.version }}-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  linux:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: uv sync --locked --group build
      - run: uv run --group build pyinstaller --noconfirm --log-level WARN packaging/rs7.spec
      - name: Smoke test
        run: ./dist/rs7/rs7 version
      - name: AppImage
        run: packaging/linux/build-appimage.sh "${{ needs.verify.outputs.version }}"
      - name: deb
        run: packaging/linux/build-deb.sh "${{ needs.verify.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb

  github-release:
    needs: [verify, test, python-dist, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            ${{ contains(needs.verify.outputs.version, '-') && '--prerelease' || '' }}

  pypi:
    needs: [verify, test, python-dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

[project]
name = "gammascientific-rs7"
version = "0.4.0"
description = "Python API, CLI, desktop GUI and web interface for the Gamma Scientific SpectralLED RS-7 light source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colour-science>=0.4.6",
    "pyserial>=3.5",
    "rich>=13",
    "scipy>=1.16",
    "typer>=0.12",
]

[project.optional-dependencies]
gui = ["pyside6>=6.6"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
rs7 = "rs7.cli:app"
rs7-gui = "rs7.gui:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyside6>=6.6",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.1a20",
    "uvicorn>=0.29",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rs7"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
